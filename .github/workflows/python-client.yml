name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "python-client/**"
      - ".github/workflows/python-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-client/**"
      - ".github/workflows/python-client.yml"

concurrency:
  group: python-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: python-client

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
