name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: service

jobs:
  # On pushes to master, auto-apply `cargo fmt` and push the result back.
  format:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    # Only this job pushes formatting commits, so only it needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the default token so the push re-uses the workflow credentials.
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit and push formatting changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "style: cargo fmt [skip ci]"
            git push
          else
            echo "already formatted"
          fi

  test:
    # Skip the redundant run triggered by the bot's formatting commit.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --assume-yes libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - name: Format check
        if: github.event_name == 'pull_request'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test --all-targets

  # Supply-chain gate: security advisories, yanked crates, licenses, sources.
  supply-chain:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny
        run: cargo deny check

  # Line coverage report, uploaded as a build artifact (lcov.info).
  coverage:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --assume-yes libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - name: Generate coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: service/lcov.info
          if-no-files-found: error
