# cargo-deny configuration: supply-chain gate run in CI.
#
# Enforced checks: known security advisories (vulnerabilities), yanked crates,
# license compliance, and that all dependencies come from crates.io. Run
# locally with `cargo deny check` (install via `cargo install cargo-deny`).

[advisories]
version = 2
# Fail on yanked crates. Vulnerabilities fail by default.
yanked = "deny"
# `paste` (RUSTSEC-2024-0436) is flagged unmaintained, but has no known
# vulnerability and no safe upgrade. It is a transitive dependency of
# `utoipa-axum` (OpenAPI routing) that cannot be dropped, so the advisory is
# explicitly acknowledged here. Revisit if utoipa-axum drops the `paste` dep.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# Permissive licenses used across the dependency tree. Add a license here if a
# new dependency introduces one that is not yet listed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are common and transitive; surface them without failing.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io is trusted; reject unknown registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
