[package]
name = "green_relay"
version = "2.0.0"
edition = "2024"
authors = ["Greenstorm5417 <Greenstorm5417@users.noreply.github.com>"]
description = "SMS microservice for a Waveshare SIM7600X modem: authenticated REST API, real-time SSE event stream, and an admin dashboard."
license = "MIT"
repository = "https://github.com/Greenstorm5417/green_relay"
readme = "../README.md"

[package.metadata.deb]
maintainer = "Greenstorm5417 <Greenstorm5417@users.noreply.github.com>"
copyright = "2025 Greenstorm5417"
section = "comm"
priority = "optional"
extended-description = """\
Green Relay is an asynchronous Rust daemon that sends and receives SMS through \
a Waveshare SIM7600X 4G USB modem over AT commands. It exposes an \
API-key-authenticated REST API, a real-time Server-Sent Events stream, and an \
Argon2-secured admin dashboard, persisting state in SQLite."""
depends = "$auto"
assets = [
    ["target/release/green_relay", "usr/bin/green_relay", "755"],
    ["../config.example.yaml", "etc/green_relay/config.example.yaml", "644"],
    ["../config.default.yaml", "etc/green_relay/config.yaml", "644"],
]
conf-files = [
    "/etc/green_relay/config.example.yaml",
    "/etc/green_relay/config.yaml",
]

[package.metadata.deb.systemd-units]
unit-scripts = "systemd"
unit-name = "green_relay"
enable = true
start = false

[features]
default = []
web-ui = ["dep:tower-http"]

[lib]
name = "green_relay"
path = "src/lib.rs"

[[bin]]
name = "green_relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs"], optional = true }
tokio-serial = "5.4.5"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
# Concurrent, bounded, TTL-evicting caches (moka) back the rate limiter and the
# API-key lookup cache, so we don't hand-maintain capacity/eviction logic.
moka = { version = "0.12", features = ["future"] }
argon2 = "0.5.3"
# Pinned to password-hash 0.5 to match argon2 0.5.3's own password-hash major:
# the `getrandom` feature only reaches argon2's salt generator (`OsRng`) when
# this resolves to the same crate version argon2 depends on. 0.6 needs the
# unreleased argon2 0.6.0-rc, so it stays on 0.5 until argon2 0.6 is stable.
password-hash = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
yaml_serde = "0.10.4"
chrono = { version = "0.4.45", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2.0"

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
tower = { version = "0.5.3", features = ["util"] }
criterion = "0.8.2"

[[bench]]
name = "hotpath"
harness = false

[[bench]]
name = "fullflow"
harness = false

# `unsafe` is forbidden across the whole package; the panic-source lints
# (unwrap/expect/panic/...) are denied at the crate level in `src/lib.rs` and
# `src/main.rs` so they apply only to the shipped library + binary, not to the
# integration tests and benches (which are allowed to panic).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
items_after_statements = "deny"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "off"
strip = true
debug-assertions = false
overflow-checks = true
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
