[package]
name = "green_relay"
version = "0.1.0"
edition = "2024"
authors = ["Greenstorm5417 <Greenstorm5417@users.noreply.github.com>"]
description = "SMS microservice for a Waveshare SIM7600X modem: authenticated REST API, real-time SSE event stream, and an admin dashboard."
license = "MIT"
repository = "https://github.com/Greenstorm5417/green_relay"
readme = "../README.md"

# Debian package metadata, consumed by `cargo deb`. Produces a `.deb` that
# installs the binary, an example config, and a systemd unit.
[package.metadata.deb]
maintainer = "Greenstorm5417 <Greenstorm5417@users.noreply.github.com>"
copyright = "2025 Greenstorm5417"
section = "comm"
priority = "optional"
extended-description = """\
Green Relay is an asynchronous Rust daemon that sends and receives SMS through \
a Waveshare SIM7600X 4G USB modem over AT commands. It exposes an \
API-key-authenticated REST API, a real-time Server-Sent Events stream, and an \
Argon2-secured admin dashboard, persisting state in SQLite."""
# `$auto` lets cargo-deb compute shared-library dependencies from the binary.
depends = "$auto"
assets = [
    ["target/release/green_relay", "usr/bin/green_relay", "755"],
    ["../config.example.yaml", "etc/green_relay/config.example.yaml", "644"],
]
conf-files = ["/etc/green_relay/config.example.yaml"]

# Install and enable the systemd unit from `service/systemd/`.
[package.metadata.deb.systemd-units]
unit-scripts = "systemd"
unit-name = "green_relay"
enable = true
start = false


# Library target exposes the crate internals so the integration tests under
# `tests/` and the benches under `benches/` can drive them; the binary is a
# thin shell over `run()`.
[features]
# Default builds ship without the bundled web UI.
default = []
# Serve the statically exported Next.js admin UI (built from `web-ui/` with
# Bun) from the service. The build script produces the static assets in
# `web-ui/out` that this feature wires into the router. Pulls in `tower-http`
# for static-file serving.
web-ui = ["dep:tower-http"]

[lib]
name = "green_relay"
path = "src/lib.rs"

[[bin]]
name = "green_relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
# `BroadcastStream` adapts the event-bus broadcast receiver into the `Stream`
# the Axum SSE responder consumes. The `sync` feature gates exactly that
# wrapper; pinned to the current 0.1 line maintained alongside Tokio.
tokio-stream = { version = "0.1.17", features = ["sync"] }
axum = "0.8.9"
tower = "0.5.3"
# Static-file serving for the bundled web UI; only compiled with `web-ui`.
tower-http = { version = "0.6", features = ["fs"], optional = true }
tokio-serial = "5.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
argon2 = "0.5.3"
# Pinned to password-hash 0.5 to match argon2 0.5.3's own password-hash major:
# the `getrandom` feature only reaches argon2's salt generator (`OsRng`) when
# this resolves to the same crate version argon2 depends on. 0.6 needs the
# unreleased argon2 0.6.0-rc, so it stays on 0.5 until argon2 0.6 is stable.
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# YAML configuration parsing. serde_yaml is archived but API-frozen and the
# most widely deployed option; the config file is a trusted local input, so the
# archival status carries minimal risk. Revisit if a maintained successor
# stabilizes.
serde_yaml = "0.9"
chrono = { version = "0.4.45", features = ["serde"] }
# OpenAPI generation. `utoipa` derives schema/path metadata from the public
# route handlers and models; `utoipa-axum` (0.2 targets axum 0.8) provides the
# `OpenApiRouter` + `routes!` bindings that keep the routing table and the
# generated spec in sync.
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
tower = { version = "0.5.3", features = ["util"] }
criterion = "0.8.2"

[[bench]]
name = "hotpath"
harness = false

[[bench]]
name = "fullflow"
harness = false

# `libc` is only needed by the Unix-gated lifecycle integration tests to send
# `SIGTERM` to the spawned service binary.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# `unsafe` is forbidden across the whole package; the panic-source lints
# (unwrap/expect/panic/...) are denied at the crate level in `src/lib.rs` and
# `src/main.rs` so they apply only to the shipped library + binary, not to the
# integration tests and benches (which are allowed to panic).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
items_after_statements = "deny"

# Build dependencies at opt-level 3 even in dev/test so the crypto-heavy crates
# (argon2, sha2) and sqlx do not make the property tests run for minutes, while
# our own crate stays unoptimized for fast incremental builds.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "off"
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
